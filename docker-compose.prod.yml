services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: connecthub
      POSTGRES_USER: ${POSTGRES_USER:-connecthub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Do NOT expose port 5432 in production — internal network only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-connecthub_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Do NOT expose port 6379 in production
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    # No volume mount — code is baked into the image
    # Port 8001 on host → 8000 inside container (avoids conflict with recipe project)
    ports:
      - "8001:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery:
    build: .
    command: celery -A config.celery worker --loglevel=info --concurrency=4
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build: .
    command: celery -A config.celery beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # NOTE: Nginx is managed by the system (not Docker) on the EC2 instance.
  # It is already running for the recipe project.
  # ConnectHub is proxied via a new Nginx server block on the host.

volumes:
  postgres_data:
