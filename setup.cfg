[tool:pytest]
DJANGO_SETTINGS_MODULE = config.settings.testing
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short -v

[coverage:run]
source = apps
omit =
    */migrations/*
    */tests/*
    */admin.py
    */apps.py

[coverage:report]
fail_under = 70
show_missing = True
skip_covered = False

[flake8]
max-line-length = 100
exclude =
    .git,
    __pycache__,
    migrations,
    venv,
    .venv
ignore = E203, W503
